<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function sum(){
            let age = parseInt(prompt("enter your age"));
            if(age>=18){
                let c = confirm("do you want to vote");
                if(c){
                    alert("your response is submitted");
                }
                else{
                    alert("thanku!");
                }
            }
            else{
                document.write("you are not eligible for voting");
            }
        }
    </script>
</head>
<body>
    <input type="button" onclick="sum()" value="check your eligibility">
    
</body>
</html>
